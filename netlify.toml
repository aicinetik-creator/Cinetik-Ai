# Netlify configuration for the Cinetik editor.
# The app is built as a static export (next.config.ts -> output: "export"),
# so Netlify only has to run the build and serve the resulting files: no
# serverless runtime and no Next.js server are involved.
[build]
  base = "apps/web"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20.9.0"
  NPM_FLAGS = "--legacy-peer-deps"

# The editor lives at /editor/<project-id>; a static export cannot have dynamic
# routes, so the id is read on the client and these rewrites keep the URLs.
[[redirects]]
  from = "/editor/*"
  to = "/editor"
  status = 200

[[redirects]]
  from = "/"
  to = "/projects"
  status = 200

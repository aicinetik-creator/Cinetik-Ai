# Netlify configuration for the Cinetik editor.
#
# The app is a static export (next.config.ts -> output: "export"). Netlify
# auto-installs its Next.js Runtime for any repo containing Next.js, and that
# runtime requires the publish directory to be `.next` - it then serves the
# exported files itself. Pointing `publish` at `out` makes the runtime fail the
# build with "publish directory does not contain expected Next.js build output".
[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.9.0"
  NPM_FLAGS = "--legacy-peer-deps"

# The editor lives at /editor/<project-id>. A static export has no dynamic
# routes, so the id is read on the client and this rewrite keeps the URLs.
[[redirects]]
  from = "/editor/*"
  to = "/editor"
  status = 200

name: pages

# Publishes the built Cinetik editor to GitHub Pages, so there is a free live URL
# that does not depend on Netlify's paid tier for private repositories.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://edit.cinetik.in
      NEXT_PUBLIC_MARBLE_API_URL: https://api.marblecms.com
      # A project Pages site is served under /<repo-name>.
      NEXT_BASE_PATH: /Cinetik-Ai
      NEXT_PUBLIC_BASE_PATH: /Cinetik-Ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build static export
        working-directory: apps/web
        run: npm run build

      - name: Deep-link fallback for /editor/<project-id>
        run: |
          # Pages has no rewrites, so an unknown path falls back to 404.html.
          # Serving the editor there keeps /editor/<id> working.
          cp apps/web/out/editor.html apps/web/out/404.html
          touch apps/web/out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
